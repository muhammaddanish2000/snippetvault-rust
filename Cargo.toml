[package]
name = "snippetvault-rust"
version = "1.0.0"
edition = "2024"
description = "A Rust Axum REST API for managing reusable code snippets."
authors = ["Muhammad Danish"]

[dependencies]
axum = "0.8.9"

tokio = { version = "1.54.1", features = ["full"] }

sqlx = {
    version = "0.9.0",
    features = [
        "runtime-tokio",
        "sqlite",
        "macros",
        "migrate"
    ]
}

tower-http = {
    version = "0.7.1",
    features = [
        "cors",
        "trace"
    ]
}

serde = {
    version = "1",
    features = ["derive"]
}

serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"

tracing-subscriber = {
    version = "0.3",
    features = ["env-filter"]
}

[profile.release]
strip = true
lto = true
codegen-units = 1
